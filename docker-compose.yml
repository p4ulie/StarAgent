# StarAgent stack. The LLM is NOT here — point LLM_BASE_URL at any external
# OpenAI-compatible endpoint: a cloud provider (e.g. https://ollama.com/v1,
# needs LLM_API_KEY) or a local server (e.g. http://host.docker.internal:8080/v1).
#
#   cp .env.example .env   # set DISCORD_TOKEN (and LLM_BASE_URL if needed)
#   docker compose up --build
#   docker compose run --rm bot star-agent-ingest   # (re)build the knowledge base

services:
  chroma:
    image: ghcr.io/chroma-core/chroma:1.5.9   # pinned: a newer Chroma may migrate the store
    volumes:
      - ./chroma-data:/data
    restart: unless-stopped
    # Not published to the host — only reachable on the internal compose network.

  bot:
    build: .
    image: star-agent:latest
    command: ["star-agent-bot"]
    env_file: .env
    environment:
      # Use LiteLLM's bundled cost map — never fetch it over the network
      # (avoids an event-loop stall / heartbeat block on the first request).
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    depends_on:
      - chroma
    extra_hosts:
      # Lets the container reach a llama.cpp server running on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Liveness only (visibility in `docker ps`). The bot touches the heartbeat
    # file every ~15s; unhealthy if it goes stale >60s (a wedged event loop).
    # NOTE: plain Compose does NOT auto-restart on unhealthy — this reports,
    # it does not recover. Add an autoheal sidecar or Swarm for that.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/star_agent.heartbeat')<60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  mcp:
    image: star-agent:latest
    build: .
    command: ["star-agent-mcp"]
    env_file: .env
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    depends_on:
      - chroma
    ports:
      - "${MCP_PORT:-8765}:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
