{{- $replicas := int .Values.replicas }}
{{- if gt $replicas 1 }}
{{- fail "replicas must be 0 or 1: two bots would both answer every question" }}
{{- end }}
{{- $_ := required "config.LLM_MODEL is required" .Values.config.LLM_MODEL }}
{{- range $component := list "bot" "mcp" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    {{- include "staragent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $replicas }}
  strategy: {type: Recreate}   # never two copies, not even during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "staragent.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      securityContext: {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "staragent.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: [star-agent-{{ $component }}]
          securityContext: {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          {{- include "staragent.env" $ | nindent 10 }}
          {{- if eq $component "bot" }}
          # The bot touches the heartbeat file every ~15 s; stale for over a minute means a wedged event loop.
          livenessProbe:
            exec:
              command: [python, -c, "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/star_agent.heartbeat')<60 else 1)"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          {{- else }}
          ports:
            - {name: mcp, containerPort: {{ $.Values.mcp.port }}}
          readinessProbe:
            tcpSocket: {port: mcp}
            periodSeconds: 10
          {{- end }}
          {{- with $.Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
  labels:
    {{- include "staragent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp
  ports:
    - {name: mcp, port: {{ .Values.mcp.port }}, targetPort: mcp}
